# Dashboard look & feel (dark "network operations" theme) and upload limit.
[theme]
base = "dark"
primaryColor = "#2dd4bf"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#111a2e"
textColor = "#e6edf7"
font = "sans-serif"

[server]
maxUploadSize = 300

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
